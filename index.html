<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tiểu luận Nhóm 4</title>
<meta name="description" content="Bàn luyện viết cho bài tổng quan tài liệu AI trong y tế: viết bằng lời của chính bạn, AI chấm và gợi mở dựa trên 27 nguồn nghiên cứu và quy ước của nhóm.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#eef2ef; --surface:#ffffff; --surface-2:#e2eae6; --surface-3:#d7e1dc;
    --ink:#132420; --muted:#55655f; --line:#c9d5cf;
    --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#dcece6;
    --accent2:#3457c9; --accent2-soft:#e1e7fb;
    --warn:#a3631a; --warn-soft:#f3e6d4;
    --good:#1f7a4d; --good-soft:#dcf0e3;
    --shadow: 0 1px 2px rgba(19,36,32,.06), 0 8px 24px -12px rgba(19,36,32,.18);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1512; --surface:#152420; --surface-2:#1b2e28; --surface-3:#22392f;
      --ink:#e3ede8; --muted:#93a69d; --line:#28423a;
      --accent:#57d9ac; --accent-ink:#07231a; --accent-soft:#173a2c;
      --accent2:#8fa9ff; --accent2-soft:#1c2748;
      --warn:#e0ac5f; --warn-soft:#3a2c17;
      --good:#6bd99a; --good-soft:#163526;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1512; --surface:#152420; --surface-2:#1b2e28; --surface-3:#22392f;
    --ink:#e3ede8; --muted:#93a69d; --line:#28423a;
    --accent:#57d9ac; --accent-ink:#07231a; --accent-soft:#173a2c;
    --accent2:#8fa9ff; --accent2-soft:#1c2748;
    --warn:#e0ac5f; --warn-soft:#3a2c17;
    --good:#6bd99a; --good-soft:#163526;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; margin:0;}
  ::selection{background:var(--accent-soft);}

  .shell{max-width:1440px; margin:0 auto;}

  /* Top bar */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:auto;}
  .brand .mark{font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.08em;
    background:var(--accent); color:var(--accent-ink); padding:3px 7px; border-radius:5px;}
  .brand h1{font-family:var(--font-display); font-weight:600; font-size:19px; margin:0;}
  .brand .sub{font-size:12px; color:var(--muted);}
  .view-toggle{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px;}
  .view-toggle button{font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--muted);
    background:transparent; border:0; border-radius:6px; padding:6px 11px; cursor:pointer;}
  .view-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .progress-pill{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px;}
  .progress-pill .ring{width:20px; height:20px; border-radius:50%;
    background: conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-3) 0);}
  .btn-mode{background:transparent; border:1px solid var(--line); border-radius:8px; padding:6px 9px; cursor:pointer; color:var(--muted); font-size:13px;}

  /* Layout */
  .body-row{display:flex; width:100%;}
  nav.outline{width:320px; flex:none; border-right:1px solid var(--line); background:var(--surface);
    padding:16px 10px 40px; overflow-y:auto; max-height:calc(100vh - 60px); position:sticky; top:60px; align-self:flex-start;}
  .chuong-group{margin-bottom:6px;}
  .chuong-head{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0;
    font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--ink);
    padding:9px 8px; border-radius:8px; cursor:pointer; line-height:1.35;}
  .chuong-head:hover{background:var(--surface-2);}
  .chuong-head .chev{font-size:10px; color:var(--muted); flex:none;}
  .chuong-head[aria-expanded="false"] .chev{transform:rotate(-90deg);}
  .sec-list{padding-left:6px;}
  .sec-btn{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0;
    font-family:var(--font-body); font-size:12.5px; color:var(--muted);
    padding:7px 10px 7px 18px; border-radius:7px; cursor:pointer; border-left:2px solid transparent; line-height:1.35;}
  .sec-btn:hover{background:var(--surface-2); color:var(--ink);}
  .sec-btn.active{background:var(--accent-soft); color:var(--ink); border-left-color:var(--accent); font-weight:600;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line); flex:none;}
  .dot.done{background:var(--good);}
  .dot.progress{background:var(--warn);}

  main.stage{flex:1; padding:26px 30px 80px; min-width:0;}
  .crumb{font-family:var(--font-mono); font-size:11.5px; color:var(--muted); letter-spacing:.04em; margin-bottom:6px;}
  .stage h2{font-family:var(--font-display); font-size:28px; font-weight:600; margin:0 0 14px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; box-shadow:var(--shadow); margin-bottom:18px;}
  .card h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; font-weight:600;}
  .brief{font-size:14.5px; line-height:1.6;}

  .meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px;}
  .meta-item{background:var(--surface-2); border-radius:9px; padding:9px 11px;}
  .meta-item .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600;}
  .meta-item .v{font-size:13.5px; margin-top:2px;}
  .note-line{display:flex; gap:9px; background:var(--warn-soft); border-radius:9px; padding:10px 12px; font-size:13px; margin-top:14px; line-height:1.5;}

  .src-list{display:grid; gap:10px;}
  .src-item{background:var(--surface-2); border-radius:10px; padding:11px 13px;}
  .src-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px;}
  .src-label{font-weight:600; font-size:13.5px;}
  .src-tag{font-family:var(--font-mono); font-size:10px; padding:2px 7px; border-radius:99px; background:var(--accent2-soft); color:var(--accent2);}
  .src-tag.vn{background:var(--good-soft); color:var(--good);}
  .src-method{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .src-find{font-size:13px; line-height:1.55; margin-top:5px;}

  .rubric{list-style:none; padding:0; margin:0; display:grid; gap:7px;}
  .rubric li{display:flex; gap:9px; font-size:13.5px; align-items:flex-start; line-height:1.5;}
  .rubric li .idx{font-family:var(--font-mono); font-size:11px; color:var(--accent2); background:var(--accent2-soft);
    border-radius:5px; padding:1px 6px; flex:none; margin-top:2px;}

  .guide-item{background:var(--accent2-soft); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  .guide-item:last-child{margin-bottom:0;}
  .guide-item .gt{font-weight:600; font-size:13.5px; margin-bottom:5px;}
  .guide-item .gb{font-size:13px; line-height:1.6;}

  textarea{width:100%; min-height:240px; resize:vertical; font-family:var(--font-body); font-size:14.5px;
    line-height:1.6; color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:14px; outline:none;}
  textarea:focus{border-color:var(--accent);}
  .wordcount{font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin-top:6px; text-align:right;}
  .actions{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  button.primary{font-family:var(--font-body); font-weight:600; font-size:13.5px; color:var(--accent-ink);
    background:var(--accent); border:0; border-radius:9px; padding:10px 18px; cursor:pointer;}
  button.primary:disabled{opacity:.55; cursor:default;}
  button.primary:hover:not(:disabled){filter:brightness(1.06);}
  button.ghost{font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--muted);
    background:transparent; border:1px solid var(--line); border-radius:9px; padding:9px 14px; cursor:pointer;}
  button.ghost:hover{color:var(--ink);}
  .feedback{border-top:3px solid var(--accent2);}
  .fb-head{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .score-ring{width:56px; height:56px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--accent2) calc(var(--sc,0)*10%), var(--surface-3) 0);}
  .score-ring span{width:44px; height:44px; border-radius:50%; background:var(--surface); display:flex; align-items:center;
    justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:15px;}
  .fb-title{font-weight:600; font-size:14.5px;}
  .fb-sub{font-size:12px; color:var(--muted);}
  .crit-row{display:flex; align-items:center; gap:10px; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line);}
  .crit-row:last-child{border-bottom:0;}
  .crit-name{flex:1; min-width:0;}
  .crit-bar{width:90px; height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; flex:none;}
  .crit-bar i{display:block; height:100%; background:var(--accent2);}
  .crit-score{font-family:var(--font-mono); font-size:12px; width:34px; text-align:right; flex:none;}
  .fb-block{margin-top:14px;}
  .fb-block h4{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px;}
  .fb-block ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.55; display:grid; gap:6px;}
  .fb-block.strengths ul li::marker{color:var(--good);}
  .fb-block.gaps ul li::marker{color:var(--warn);}
  .fb-block.srcuse ul li::marker{color:var(--accent2);}
  .hint-box{background:var(--accent2-soft); border-radius:9px; padding:10px 12px; font-size:13.5px; margin-top:12px; line-height:1.55;}

  .empty-hint{color:var(--muted); font-size:13.5px; padding:10px 2px; line-height:1.6;}
  .thinking{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; font-family:var(--font-mono);}
  .spinner{width:13px; height:13px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent2); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }

  /* Sources view */
  .ov-summary{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .ov-stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; box-shadow:var(--shadow); min-width:130px;}
  .ov-stat .num{font-family:var(--font-display); font-size:26px; font-weight:600;}
  .ov-stat .lbl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .used-in{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:7px;}

  footer.note{max-width:760px; font-size:12px; color:var(--muted); margin-top:26px; line-height:1.6;}

  @media (max-width: 900px){
    .body-row{flex-direction:column;}
    nav.outline{width:100%; max-height:none; position:static; border-right:0; border-bottom:1px solid var(--line);}
    main.stage{padding:20px 16px 60px;}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <span class="mark">AI·YT</span>
      <div>
        <h1>Nhóm 4</h1>
        <div class="sub">Tổng quan tài liệu — AI trong y tế</div>
      </div>
    </div>
    <div class="view-toggle" id="viewToggle">
      <button data-view="practice" class="active">Luyện viết</button>
      <button data-view="sources">27 nguồn &amp; quy ước</button>
    </div>
    <div class="progress-pill" id="progressPill" title="Số đầu việc đã được chấm điểm">
      <span class="ring" id="progressRing"></span>
      <span id="progressText">0/38</span>
    </div>
    <button class="btn-mode" id="themeBtn" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="body-row">
    <nav class="outline" id="outlineNav" aria-label="Danh sách đầu việc"></nav>
    <main class="stage" id="stage"></main>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     CƠ SỞ DỮ LIỆU TỰ THÂN CỦA ARTIFACT
     - GUIDELINES: quy ước chung trích từ gop_y.docx (cập nhật khi nhóm gửi bản mới)
     - SOURCES:    27 bài nghiên cứu trong thư mục "Nguồn tham khảo"
     - OUTLINE:    38 đầu việc theo sheet "phan_cong_chi_tiet" của Phan_cong.xlsx
     ============================================================ */

  var GUIDELINES = [
    {
      title: "Dùng đúng thuật ngữ: \"AI trong y tế\" là phạm vi chính, \"AI agent\" là một nhóm bên trong",
      body: "Nhiều nghiên cứu nhóm thu thập nói về Machine Learning, Deep Learning, NLP, chatbot, hệ hỗ trợ quyết định và phân tích hình ảnh — những công nghệ này không đương nhiên là AI agent. Chỉ gọi là \"AI agent\" khi hệ thống trong nghiên cứu thực sự có khả năng: tự nhận biết/xác định nhiệm vụ, lập kế hoạch thực hiện, sử dụng công cụ hoặc dữ liệu, thực hiện quy trình nhiều bước, và tương tác với con người dưới sự giám sát. Nếu phạm vi bao quát mọi công nghệ AI thì lấy \"AI trong y tế\" làm phạm vi chính."
    },
    {
      title: "Không gọi H1/H2/H3 là giả thuyết nghiên cứu — gọi là \"mệnh đề phân tích\"",
      body: "Đây là bài tổng quan tài liệu, nhóm không khảo sát sơ cấp và không kiểm định thống kê mới. Vì vậy không dùng các cụm \"giả thuyết được chấp nhận/bác bỏ\", \"kiểm định giả thuyết\". Nếu vẫn giữ H1, H2, H3 thì gọi là \"mệnh đề phân tích\" hoặc \"định hướng phân tích\", và đối chiếu chúng với bằng chứng đã công bố thay vì khẳng định đã kiểm định."
    }
  ];

  /* ---------- 27 nguồn tham khảo ---------- */
  var SOURCES = {
    S1: { label: "Đại Trần Lê Vương (2025)", origin: "VN", group: "Tổng quan VN",
          method: "Scoping review 37 nghiên cứu AI y tế Việt Nam, giai đoạn 2018–2024",
          findings: "Chỉ khoảng 9% cơ sở y tế Việt Nam ứng dụng AI, so với hơn 70% ở nhóm nước phát triển. 46% nghiên cứu tập trung vào chẩn đoán hình ảnh; chỉ 11% về chatbot/trợ lý ảo; gần như 0% về vận hành nội bộ bệnh viện." },
    S2: { label: "Đào Văn Dũng & Trần Quốc Thắng (2024)", origin: "VN", group: "Vận hành nội bộ",
          method: "Bài tổng quan về Big Data và AI trong quản trị bệnh viện tại Việt Nam",
          findings: "Phân tích tiềm năng của dữ liệu lớn và AI trong quản trị bệnh viện; nhấn mạnh hạ tầng dữ liệu phân mảnh và thiếu chuẩn hóa là rào cản nền tảng." },
    S3: { label: "Nguyễn Phan Lâm Quỳnh và cộng sự (2025)", origin: "VN", group: "Trải nghiệm bệnh nhân",
          method: "Khảo sát cắt ngang 613 bệnh nhân da liễu tại Huế",
          findings: "Nhóm bệnh nhân đã từng dùng AI trong chăm sóc da liễu có thái độ tích cực hơn, tự tin hơn và phản đối mạnh hơn quan điểm AI thay thế hoàn toàn bác sĩ (p<0,05). Bằng chứng cho thấy tâm lý tiếp nhận của người bệnh không phải rào cản lớn nhất." },
    S4: { label: "Nguyễn Thị Thu Thảo và cộng sự (2025)", origin: "VN", group: "Hỗ trợ bác sĩ",
          method: "Mô hình học sâu CaraNet (CNN + Attention), đối chứng trên 200 ca CT ngực tại Bệnh viện Bạch Mai (phối hợp ĐHQG Hà Nội)",
          findings: "Độ nhạy 90%, độ đặc hiệu 91%, độ chính xác 90% trong hỗ trợ chẩn đoán ung thư phổi — bằng chứng thực nghiệm định lượng đầu tiên trong nước ở mảng hỗ trợ bác sĩ." },
    S5: { label: "Nguyễn Văn Điền & Nguyễn Thùy Trang (2025)", origin: "VN", group: "Tổng quan VN",
          method: "Bài tổng quan về các ứng dụng AI trong chăm sóc sức khỏe",
          findings: "Hệ thống hóa các nhóm ứng dụng AI trong y tế và điều kiện triển khai tại Việt Nam." },
    S6: { label: "Tạ Thị Nguyệt Trang và cộng sự (2025)", origin: "VN", group: "Rào cản & chấp nhận",
          method: "Khảo sát 573 nhân viên y tế tại các bệnh viện lớn ở Hà Nội; mô hình UTAUT mở rộng bằng biến \"perceived AI threat\"",
          findings: "Cảm nhận bị AI đe dọa tác động âm đáng kể tới ý định ứng dụng AI, thậm chí làm suy yếu hiệu ứng tích cực của kỳ vọng hiệu suất và ảnh hưởng xã hội; mô hình giải thích 79,8% biến thiên ý định ứng dụng." },
    S7: { label: "Chen và cộng sự (2026)", origin: "QT", group: "Trải nghiệm bệnh nhân",
          method: "Phân tích gộp 7 nghiên cứu (6 thử nghiệm ngẫu nhiên có đối chứng) về chatbot AI hỗ trợ tuân thủ dùng thuốc ở bệnh mạn tính",
          findings: "Cải thiện tuân thủ dùng thuốc có ý nghĩa thống kê, SMD = 0,69 (p=0,01). Chatbot tích hợp cả ba chức năng (nhắc nhở, giáo dục, hỏi đáp thời gian thực) hiệu quả hơn loại chỉ có hai chức năng." },
    S8: { label: "Chennupati (2025)", origin: "QT", group: "Vận hành nội bộ",
          method: "Đề xuất khung AIRA-Hospital: AI tạo sinh kết hợp tự động hóa quy trình bằng robot (RPA)",
          findings: "Phân bổ nguồn lực cấp cứu theo thời gian thực, cải thiện thông lượng khoa cấp cứu và giảm tỷ lệ hủy lịch phẫu thuật." },
    S9: { label: "Gaber và cộng sự (2025)", origin: "QT", group: "Hỗ trợ bác sĩ",
          method: "Thử nghiệm quy trình LLM có tăng cường truy xuất (RAG) trên 2.000 ca bệnh từ cơ sở dữ liệu MIMIC",

  /* ---------- Goi AI qua server cua chinh ban (/api/grade tren Vercel) ---------- */
  async function callAI(prompt){
    var response;
    try{
      response = await fetch("/api/grade", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ prompt: prompt })
      });
    }catch(networkErr){
      var eNet = new Error("Khong ket noi duoc toi may cham diem");
      eNet.code = "network"; throw eNet;
    }
    if(!response.ok){
      var bodyText = await response.text().catch(function(){ return ""; });
      var eHttp = new Error("HTTP " + response.status + " - " + bodyText);
      eHttp.code = "http_error"; throw eHttp;
    }
    var data = await response.json();
    if(data && data.error){
      var eApi = new Error(data.error || "Loi goi API");
      eApi.code = "api_error"; throw eApi;
    }
    try{ return extractJson(data.text); }
    catch(err){
      var eJson = new Error(err.message); eJson.code = "invalid_json"; eJson.text = data.text; throw eJson;
    }
  }

  function extractJson(text){
    if(typeof text !== "string") throw new Error("phản hồi rỗng");
    var fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    var c = fence ? fence[1] : text;
    var start = -1, endCh = null;
    for(var i=0;i<c.length;i++){
      if(c[i] === "{"){ start = i; endCh = "}"; break; }
      if(c[i] === "["){ start = i; endCh = "]"; break; }
    }
    if(start === -1) throw new Error("không tìm thấy JSON");
    var end = c.lastIndexOf(endCh);
    if(end <= start) throw new Error("JSON không hoàn chỉnh");
    var jsonStr = c.slice(start, end+1);
    jsonStr = jsonStr.replace(/,\s*([}\]])/g, "$1");
    try{ return JSON.parse(jsonStr); }
    catch(e1){
      var fixed = jsonStr.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
      return JSON.parse(fixed);
    }
  }

  function buildPrompt(sec, draftText){
    var L = [];
    L.push("Bạn là trợ giảng chấm bài cho một nhóm sinh viên MBA đang viết BÀI TỔNG QUAN TÀI LIỆU về ứng dụng AI trong hệ sinh thái chăm sóc sức khỏe (vận hành nội bộ, trải nghiệm bệnh nhân, hỗ trợ quyết định lâm sàng).");
    L.push("QUY TẮC TỐI THƯỢNG: TUYỆT ĐỐI KHÔNG viết hộ đoạn văn hoàn chỉnh, KHÔNG đưa câu mẫu để họ chép vào bài. Mục đích là để chính người viết tự diễn đạt bằng lời của họ. Khi thiếu ý, chỉ được GỢI Ý bằng câu hỏi mở.");
    L.push("");
    L.push("QUY ƯỚC BẮT BUỘC CỦA NHÓM (trích từ file góp ý — vi phạm quy ước này phải bị trừ điểm và nêu rõ trong phần gaps):");
    GUIDELINES.forEach(function(g){ L.push("- " + g.title + ": " + g.body); });
    L.push("");
    L.push("ĐẦU VIỆC ĐANG LUYỆN: " + sec.stt + "/38 — mục " + sec.id + ". " + sec.title + " (thuộc " + sec.ch + ")");
    L.push("Nội dung cần thực hiện: " + sec.task);
    L.push("Sản phẩm đầu ra mong đợi: " + sec.output);
    if(sec.note) L.push("Ghi chú riêng của nhóm cho mục này: " + sec.note);
    L.push("");
    if(sec.src && sec.src.length){
      L.push("CÁC NGUỒN NGHIÊN CỨU NHÓM ĐÃ THU THẬP, LIÊN QUAN TỚI MỤC NÀY (bài viết phải nhất quán với những dữ kiện này; nếu bài viết nêu số liệu sai lệch so với đây thì phải chỉ ra):");
      sec.src.forEach(function(k){
        var s = SOURCES[k];
        if(!s) return;
        L.push("- " + s.label + " [" + (s.origin === "VN" ? "Việt Nam" : "Quốc tế") + " · " + s.group + "]");
        L.push("  Phương pháp: " + s.method);
        L.push("  Kết quả chính: " + s.findings);
      });
      L.push("");
    }
    L.push("TIÊU CHÍ CHẤM (mỗi tiêu chí cho điểm 0-10):");
    sec.rubric.forEach(function(r,i){ L.push((i+1) + ". " + r); });
    L.push("");
    L.push("BÀI VIẾT CỦA SINH VIÊN:");
    L.push('"""');
    L.push(draftText.slice(0, 5000));
    L.push('"""');
    L.push("");
    L.push("ĐỊNH DẠNG TRẢ LỜI (bắt buộc): chỉ in ra DUY NHẤT một JSON object hợp lệ, ký tự đầu là { và ký tự cuối là }. Không lời dẫn, không giải thích ngoài JSON, không dùng khối mã markdown.");
    L.push("Các khoá bắt buộc: overall (số 0-10); criteria (mảng các {name, score}, mỗi tiêu chí ở trên một phần tử, name rút gọn dưới 8 từ); strengths (mảng tối đa 3 chuỗi, điểm mạnh cụ thể dựa trên chính câu chữ họ viết); gaps (mảng tối đa 3 chuỗi, mỗi chuỗi là một CÂU HỎI gợi mở để họ tự bổ sung, không phải câu khẳng định); sources (mảng tối đa 3 chuỗi, mỗi chuỗi gợi ý — dưới dạng câu hỏi — về nguồn nào trong danh sách trên nên được dùng hoặc dùng chính xác hơn, ghi rõ tên tác giả và năm); next_step (một chuỗi, một câu gợi ý hướng suy nghĩ tiếp theo, dưới 30 từ, không phải câu văn để chép).");
    L.push("Ví dụ đúng định dạng (nội dung chỉ minh hoạ, phải chấm theo bài thật ở trên):");
    L.push('{"overall": 6.5, "criteria": [{"name": "Số liệu có nguồn", "score": 7}, {"name": "Phân biệt quốc tế/VN", "score": 6}], "strengths": ["Nêu được con số 9% và so sánh với nhóm nước phát triển"], "gaps": ["Bạn lấy con số đó từ nghiên cứu nào, cỡ mẫu bao nhiêu?"], "sources": ["Bạn có thể dùng thêm số liệu của Wang và cộng sự (2026) để minh hoạ mảng vận hành nội bộ không?"], "next_step": "Thử thêm một ví dụ bệnh viện cụ thể để phần này bớt trừu tượng."}');
    L.push("Toàn bộ nội dung JSON viết bằng tiếng Việt.");
    return L.join("\n");
  }

  function normalizeFeedback(data){
    data = data || {};
    var overall = Number(data.overall); if(!isFinite(overall)) overall = 0;
    overall = Math.max(0, Math.min(10, overall));
    var criteria = Array.isArray(data.criteria) ? data.criteria.map(function(c){
      return { name: String(c && c.name || "Tiêu chí"), score: Math.max(0, Math.min(10, Number(c && c.score) || 0)) };
    }) : [];
    return {
      overall: overall, criteria: criteria,
      strengths: Array.isArray(data.strengths) ? data.strengths.map(String) : [],
      gaps: Array.isArray(data.gaps) ? data.gaps.map(String) : [],
      sources: Array.isArray(data.sources) ? data.sources.map(String) : [],
      next_step: typeof data.next_step === "string" ? data.next_step : "",
      ts: Date.now()
    };
  }

  function renderFeedback(id){
    var slot = document.getElementById("fbSlot");
    if(!slot) return;
    var rec = state.drafts[id];
    if(!rec || !rec.feedback){ slot.innerHTML = ""; return; }
    var fb = rec.feedback;
    var html = '<div class="card feedback"><div class="fb-head">';
    html += '<div class="score-ring" style="--sc:' + fb.overall + '"><span>' + fb.overall.toFixed(1) + '</span></div>';
    html += '<div><div class="fb-title">Nhận xét từ AI</div><div class="fb-sub">' + (rec.updatedAt ? "cập nhật " + timeAgo(rec.updatedAt) : "") + '</div></div>';
    html += '</div>';
    if(fb.criteria.length){
      html += '<div>';
      fb.criteria.forEach(function(c){
        html += '<div class="crit-row"><span class="crit-name">' + escapeHtml(c.name) + '</span>' +
          '<span class="crit-bar"><i style="width:' + (c.score*10) + '%"></i></span>' +
          '<span class="crit-score">' + c.score.toFixed(1) + '</span></div>';
      });
      html += '</div>';
    }
    if(fb.strengths.length){
      html += '<div class="fb-block strengths"><h4>Điểm mạnh</h4><ul>';
      fb.strengths.forEach(function(s){ html += '<li>' + escapeHtml(s) + '</li>'; });
      html += '</ul></div>';
    }
    if(fb.gaps.length){
      html += '<div class="fb-block gaps"><h4>Câu hỏi để bạn tự bổ sung</h4><ul>';
      fb.gaps.forEach(function(s){ html += '<li>' + escapeHtml(s) + '</li>'; });
      html += '</ul></div>';
    }
    if(fb.sources && fb.sources.length){
      html += '<div class="fb-block srcuse"><h4>Gợi ý dùng nguồn nghiên cứu</h4><ul>';
      fb.sources.forEach(function(s){ html += '<li>' + escapeHtml(s) + '</li>'; });
      html += '</ul></div>';
    }
    if(fb.next_step) html += '<div class="hint-box">👉 ' + escapeHtml(fb.next_step) + '</div>';
    html += '</div>';
    slot.innerHTML = html;
  }

  /* ---------- Sources & guidelines view ---------- */
  function renderSources(){
    var keys = Object.keys(SOURCES);
    var vn = keys.filter(function(k){ return SOURCES[k].origin === "VN"; }).length;
    var html = '<div class="crumb">CƠ SỞ ĐÁNH GIÁ</div><h2>27 nguồn nghiên cứu &amp; quy ước của nhóm</h2>';
    html += '<div class="ov-summary">';
    html += '<div class="ov-stat"><div class="num">' + keys.length + '</div><div class="lbl">Nguồn nghiên cứu</div></div>';
    html += '<div class="ov-stat"><div class="num">' + vn + '</div><div class="lbl">Nguồn Việt Nam</div></div>';
    html += '<div class="ov-stat"><div class="num">' + (keys.length - vn) + '</div><div class="lbl">Nguồn quốc tế</div></div>';
    html += '<div class="ov-stat"><div class="num">' + OUTLINE.length + '</div><div class="lbl">Đầu việc</div></div>';
    html += '</div>';

    html += '<div class="card"><h3>Danh sách nguồn — dùng cho mục nào</h3><div class="src-list">';
    keys.forEach(function(k){
      var usedIn = OUTLINE.filter(function(s){ return s.src && s.src.indexOf(k) !== -1; }).map(function(s){ return s.id; });
      html += srcItemHtml(k).replace('</div></div>', '</div><div class="used-in">Dùng cho mục: ' +
        (usedIn.length ? escapeHtml(usedIn.join(", ")) : "chưa gắn mục nào") + '</div></div>');
    });
    html += '</div></div>';
    html += '<footer class="note">Khi nhóm bổ sung bài nghiên cứu mới hoặc cập nhật file góp ý, hãy báo để cập nhật phần này — toàn bộ phần chấm điểm và gợi ý sẽ tự động dùng cơ sở mới.</footer>';
    stageEl.innerHTML = html;
  }

  /* ---------- Utils ---------- */
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function debounce(fn, ms){ var t; return function(){ var a = arguments; clearTimeout(t); t = setTimeout(function(){ fn.apply(null, a); }, ms); }; }
  function timeAgo(ts){
    var s = Math.floor((Date.now() - ts) / 1000);
    if(s < 60) return "vừa xong";
    if(s < 3600) return Math.floor(s/60) + " phút trước";
    if(s < 86400) return Math.floor(s/3600) + " giờ trước";
    return Math.floor(s/86400) + " ngày trước";
  }

  /* ---------- Boot ---------- */
  render();
})();
</script>
